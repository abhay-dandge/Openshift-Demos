apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: custom-s2i-builder
  labels:
    app: custom-s2i-builder
    app.kubernetes.io/part-of: openshift-demos
spec:
  runPolicy: Serial
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: custom-s2i-builder:latest
  triggers:
    - type: ConfigChange
