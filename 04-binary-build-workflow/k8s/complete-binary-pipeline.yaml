apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: binary-python-demo
  labels:
    app: binary-python-demo
    app.kubernetes.io/part-of: openshift-demos
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: binary-python-demo
  labels:
    app: binary-python-demo
    app.kubernetes.io/part-of: openshift-demos
spec:
  runPolicy: Serial
  source:
    type: Binary
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        name: python:3.9-ubi9
        namespace: openshift
      env:
        - name: APP_FILE
          value: main.py
  output:
    to:
      kind: ImageStreamTag
      name: binary-python-demo:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: binary-python-demo
  labels:
    app: binary-python-demo
    app.kubernetes.io/part-of: openshift-demos
  annotations:
    image.openshift.io/triggers: |-
      [
        {
          "from": {
            "kind": "ImageStreamTag",
            "name": "binary-python-demo:latest"
          },
          "fieldPath": "spec.template.spec.containers[?(@.name=='app')].image"
        }
      ]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: binary-python-demo
  template:
    metadata:
      labels:
        app: binary-python-demo
    spec:
      containers:
        - name: app
          image: binary-python-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: binary-python-demo
  labels:
    app: binary-python-demo
    app.kubernetes.io/part-of: openshift-demos
spec:
  selector:
    app: binary-python-demo
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: binary-python-demo
  labels:
    app: binary-python-demo
    app.kubernetes.io/part-of: openshift-demos
spec:
  to:
    kind: Service
    name: binary-python-demo
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
