apiVersion: v1
kind: ConfigMap
metadata:
  name: prod-app-config
  namespace: openshift-demos
  labels:
    app: production-stack
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  FEATURE_ANALYTICS: "true"
  app-config.json: |
    {
      "site_title": "OpenShift Enterprise S2I Platform",
      "cache_ttl_seconds": 3600,
      "rate_limit_per_minute": 500,
      "allowed_cors_origins": ["https://*.apps.cluster.domain"]
    }
