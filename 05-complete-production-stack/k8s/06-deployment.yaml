apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-stack
  namespace: openshift-demos
  labels:
    app: production-stack
  annotations:
    image.openshift.io/triggers: |-
      [
        {
          "from": {
            "kind": "ImageStreamTag",
            "name": "production-stack:latest"
          },
          "fieldPath": "spec.template.spec.containers[?(@.name=='app')].image"
        }
      ]
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: production-stack
  template:
    metadata:
      labels:
        app: production-stack
    spec:
      serviceAccountName: prod-app-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: production-stack:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: CONFIG_FILE_PATH
              value: "/etc/config/app-config.json"
            # Injected from ConfigMap
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: prod-app-config
                  key: APP_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: prod-app-config
                  key: LOG_LEVEL
            - name: FEATURE_ANALYTICS
              valueFrom:
                configMapKeyRef:
                  name: prod-app-config
                  key: FEATURE_ANALYTICS
            # Injected from Secret
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: prod-app-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prod-app-secret
                  key: DB_PASSWORD
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: prod-app-secret
                  key: API_KEY
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config-volume
          configMap:
            name: prod-app-config
            items:
              - key: app-config.json
                path: app-config.json
