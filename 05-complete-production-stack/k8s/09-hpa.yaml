apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: production-stack-hpa
  namespace: openshift-demos
  labels:
    app: production-stack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: production-stack
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
